# GitHub Actions workflow for the render image. publish-image.sh copies this to .github/workflows/image.yml in the image repo.
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tag from the file hashes
        id: tag
        run: |
          echo "tag=$(cat Dockerfile remote/setup.sh remote/chrome-gpu.sh | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Free disk space (the CUDA base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.tag.outputs.owner }}/studio-render:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.tag.outputs.owner }}/studio-render:latest
